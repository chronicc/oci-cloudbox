name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          experimental: true

      - name: Fetch repository tags
        run: git fetch --unshallow --tags

      - run: mise run test
